<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Libro de Amor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Quicksand:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 25%, #f48fb1 50%, #f8bbd0 75%, #fce4ec 100%);
    background-size: 400% 400%;
    animation: bgShift 20s ease infinite;
    font-family: 'Quicksand', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 20px;
  }

  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating hearts */
  .hearts-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .heart-float {
    position: absolute;
    animation: floatUp 8s linear infinite;
    opacity: 0.3;
    font-size: 24px;
  }

  @keyframes floatUp {
    0% { transform: translateY(110vh) rotate(0deg) scale(0.5); opacity: 0; }
    10% { opacity: 0.35; }
    50% { opacity: 0.35; }
    90% { opacity: 0.05; }
    100% { transform: translateY(-10vh) rotate(720deg) scale(1.2); opacity: 0; }
  }

  .heart-float:nth-child(1) { left: 5%; animation-duration: 12s; animation-delay: 0s; font-size: 18px; }
  .heart-float:nth-child(2) { left: 15%; animation-duration: 9s; animation-delay: 2s; font-size: 30px; }
  .heart-float:nth-child(3) { left: 28%; animation-duration: 14s; animation-delay: 4s; font-size: 22px; }
  .heart-float:nth-child(4) { left: 40%; animation-duration: 10s; animation-delay: 1s; font-size: 26px; }
  .heart-float:nth-child(5) { left: 52%; animation-duration: 13s; animation-delay: 3s; font-size: 20px; }
  .heart-float:nth-child(6) { left: 64%; animation-duration: 11s; animation-delay: 5s; font-size: 28px; }
  .heart-float:nth-child(7) { left: 75%; animation-duration: 8s; animation-delay: 1.5s; font-size: 16px; }
  .heart-float:nth-child(8) { left: 85%; animation-duration: 15s; animation-delay: 3.5s; font-size: 32px; }
  .heart-float:nth-child(9) { left: 92%; animation-duration: 9s; animation-delay: 0.5s; font-size: 24px; }
  .heart-float:nth-child(10) { left: 10%; animation-duration: 7s; animation-delay: 6s; font-size: 20px; }
  .heart-float:nth-child(11) { left: 35%; animation-duration: 16s; animation-delay: 2.5s; font-size: 14px; }
  .heart-float:nth-child(12) { left: 70%; animation-duration: 11s; animation-delay: 4.5s; font-size: 26px; }

  /* Main container */
  .main-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title {
    font-family: 'Dancing Script', cursive;
    font-size: 3.5rem;
    color: #880e4f;
    text-align: center;
    margin-bottom: 5px;
    text-shadow: 2px 2px 8px rgba(136, 14, 79, 0.2);
    animation: softPulse 3s ease-in-out infinite;
  }

  @keyframes softPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  .subtitle {
    font-family: 'Dancing Script', cursive;
    font-size: 1.6rem;
    color: #ad1457;
    margin-bottom: 25px;
    opacity: 0.85;
  }

  /* Book wrapper */
  .book-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    width: 100%;
  }

  .book-frame {
    perspective: 2500px;
    position: relative;
    display: flex;
  }

  .book {
    display: flex;
    background: linear-gradient(to right, #d81b60 0%, #e91e63 5%, #f06292 10%, #f48fb1 50%, #f06292 90%, #e91e63 95%, #d81b60 100%);
    border-radius: 8px 16px 16px 8px;
    box-shadow:
      0 20px 60px rgba(136, 14, 79, 0.4),
      0 4px 15px rgba(0,0,0,0.15),
      inset 0 0 30px rgba(255,255,255,0.15);
    padding: 15px 20px 15px 25px;
    position: relative;
  }

  /* Book spine detail */
  .book::before {
    content: '';
    position: absolute;
    left: 6px; top: 8px; bottom: 8px;
    width: 3px;
    background: linear-gradient(to bottom, #c51162, #880e4f, #c51162);
    border-radius: 2px;
  }

  .page-wrapper {
    perspective: 2000px;
    position: relative;
  }

  .page {
    width: 450px;
    height: 600px;
    background: #fffef9;
    border-radius: 4px 10px 10px 4px;
    box-shadow:
      2px 2px 12px rgba(0,0,0,0.25),
      -2px 0 6px rgba(0,0,0,0.08),
      inset 0 0 0 1px rgba(0,0,0,0.03);
    position: relative;
    transform-origin: left center;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    transform-style: preserve-3d;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page.flipping {
    transform: rotateY(-180deg);
  }

  .page canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 15px;
    border-radius: 3px;
  }

  .page-number {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.85rem;
    color: #ad1457;
    opacity: 0.6;
    pointer-events: none;
  }

  /* Page curl effect */
  .page::after {
    content: '';
    position: absolute;
    right: 0; bottom: 0;
    width: 30px; height: 30px;
    background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.04) 50%);
  }

  /* Nav buttons */
  .nav-btn {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    border: 2px solid #e91e63;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
    color: #ad1457;
    font-size: 24px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(136, 14, 79, 0.2);
    position: relative;
    flex-shrink: 0;
  }

  .nav-btn:hover {
    background: #fce4ec;
    transform: scale(1.1);
    box-shadow: 0 6px 25px rgba(136, 14, 79, 0.35);
    border-color: #c51162;
  }

  .nav-btn:active {
    transform: scale(0.95);
  }

  .nav-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    box-shadow: 0 2px 8px rgba(136, 14, 79, 0.1);
  }

  /* Bottom controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 25px;
  }

  .page-indicator {
    font-family: 'Quicksand', sans-serif;
    font-size: 1rem;
    color: #880e4f;
    font-weight: 500;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(5px);
    padding: 8px 20px;
    border-radius: 20px;
    box-shadow: 0 2px 10px rgba(136, 14, 79, 0.15);
  }

  /* Upload area */
  .upload-area {
    margin-bottom: 20px;
    padding: 15px 30px;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(10px);
    border: 2px dashed #e91e63;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .upload-area:hover {
    background: rgba(255,255,255,0.7);
    border-color: #c51162;
    box-shadow: 0 4px 20px rgba(233, 30, 99, 0.25);
  }

  .upload-label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    color: #880e4f;
    font-family: 'Quicksand', sans-serif;
    font-weight: 500;
    font-size: 1.05rem;
  }

  .upload-icon {
    font-size: 28px;
  }

  #file-input { display: none; }

  /* Loading overlay */
  .loading {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(252, 228, 236, 0.85);
    backdrop-filter: blur(3px);
    border-radius: 8px 14px 14px 8px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
  }

  .loading.active {
    display: flex;
  }

  .spinner {
    width: 40px; height: 40px;
    border: 4px solid #f8bbd0;
    border-top-color: #e91e63;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-text {
    color: #880e4f;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.9rem;
  }

  /* Placeholder */
  .placeholder-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    color: #ad1457;
    padding: 40px;
    text-align: center;
  }

  .placeholder-icon { font-size: 70px; opacity: 0.5; }
  .placeholder-title {
    font-family: 'Dancing Script', cursive;
    font-size: 2rem;
    opacity: 0.6;
  }
  .placeholder-text {
    font-size: 0.95rem;
    opacity: 0.5;
    max-width: 300px;
    line-height: 1.5;
  }

  /* Corner decoration */
  .corner-decor {
    position: fixed;
    pointer-events: none;
    z-index: 0;
  }
  .corner-decor.top-left { top: 15px; left: 15px; font-size: 40px; opacity: 0.25; }
  .corner-decor.top-right { top: 15px; right: 15px; font-size: 40px; opacity: 0.25; }
  .corner-decor.bottom-left { bottom: 15px; left: 15px; font-size: 40px; opacity: 0.25; }
  .corner-decor.bottom-right { bottom: 15px; right: 15px; font-size: 40px; opacity: 0.25; }

  @media (max-width: 768px) {
    .title { font-size: 2.2rem; }
    .subtitle { font-size: 1.2rem; }
    .page { width: 280px; height: 400px; }
    .nav-btn { width: 42px; height: 42px; font-size: 18px; }
    .book-container { gap: 10px; }
    .book { padding: 10px 12px 10px 18px; }
  }
</style>
</head>
<body>

<div class="corner-decor top-left">🌹</div>
<div class="corner-decor top-right">💕</div>
<div class="corner-decor bottom-left">💕</div>
<div class="corner-decor bottom-right">🌹</div>

<div class="hearts-bg" id="heartsBg"></div>

<div class="main-container">
  <h1 class="title">Nuestro Libro de Amor</h1>
  <p class="subtitle">Cada página, un recuerdo contigo</p>

  <div class="book-container" id="bookContainer">
    <button class="nav-btn" id="prevBtn" title="Página anterior" disabled>◀</button>

    <div class="book-frame">
      <div class="book">
        <div class="page-wrapper">
          <div class="page" id="page">
            <div class="loading" id="loading">
              <div class="spinner"></div>
              <span class="loading-text">Abriendo nuestro libro...</span>
            </div>
            <canvas id="pdfCanvas"></canvas>
            <div class="placeholder-content" id="placeholder">
              <span class="placeholder-icon">💝</span>
              <span class="placeholder-title">Cargando nuestra historia...</span>
            </div>
            <span class="page-number" id="pageNumber"></span>
          </div>
        </div>
      </div>
    </div>

    <button class="nav-btn" id="nextBtn" title="Página siguiente" disabled>▶</button>
  </div>

  <div class="controls">
    <span class="page-indicator" id="pageIndicator">Cargando libro...</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let currentPage = 1;
let totalPages = 0;
let isFlipping = false;
let renderedPages = {};

const pageEl = document.getElementById('page');
const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const loadingEl = document.getElementById('loading');
const placeholderEl = document.getElementById('placeholder');
const pageNumberEl = document.getElementById('pageNumber');
const pageIndicatorEl = document.getElementById('pageIndicator');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

// Generate floating hearts
(function generateHearts() {
  const container = document.getElementById('heartsBg');
  const hearts = ['💖', '💗', '💓', '💕', '💘', '💝', '💞', '🩷'];
  for (let i = 0; i < 12; i++) {
    const heart = document.createElement('span');
    heart.className = 'heart-float';
    heart.textContent = hearts[i % hearts.length];
    container.appendChild(heart);
  }
})();

// Auto-load the PDF on page load
(async function init() {
  loadingEl.classList.add('active');
  try {
    const response = await fetch('History.pdf');
    if (!response.ok) throw new Error('PDF not found');
    const arrayBuffer = await response.arrayBuffer();
    await loadPDFData(arrayBuffer);
  } catch (err) {
    console.warn('Could not auto-load History.pdf:', err.message);
    placeholderEl.innerHTML = `
      <span class="placeholder-icon">📖</span>
      <span class="placeholder-title">Arrastra tu PDF aquí</span>
      <span class="placeholder-text">O haz clic para seleccionar tu archivo PDF</span>
    `;
    loadingEl.classList.remove('active');
    pageIndicatorEl.textContent = 'Esperando libro...';
  }
})();

// Fallback: drag & drop or click to load a different PDF
document.body.addEventListener('dragover', (e) => {
  e.preventDefault();
});

document.body.addEventListener('drop', async (e) => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && file.type === 'application/pdf') {
    loadingEl.classList.add('active');
    const arrayBuffer = await file.arrayBuffer();
    await loadPDFData(arrayBuffer);
  }
});

pageEl.addEventListener('click', (e) => {
  if (pdfDoc && !isFlipping) {
    const rect = pageEl.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 2) {
      flipPage('prev');
    } else {
      flipPage('next');
    }
  } else if (!pdfDoc) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.pdf';
    input.onchange = async () => {
      const file = input.files[0];
      if (file) {
        loadingEl.classList.add('active');
        const arrayBuffer = await file.arrayBuffer();
        await loadPDFData(arrayBuffer);
      }
    };
    input.click();
  }
});

async function loadPDFData(arrayBuffer) {
  pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  totalPages = pdfDoc.numPages;
  currentPage = 1;
  renderedPages = {};
  placeholderEl.style.display = 'none';
  pageNumberEl.style.display = 'block';
  updateButtons();
  renderPage(currentPage);
}

function updateButtons() {
  prevBtn.disabled = currentPage <= 1;
  nextBtn.disabled = currentPage >= totalPages;
  pageIndicatorEl.textContent = `${currentPage} / ${totalPages}`;
  pageNumberEl.textContent = `Pág. ${currentPage}`;
}

async function renderPage(pageNum) {
  if (!pdfDoc) return;
  loadingEl.classList.add('active');

  if (renderedPages[pageNum]) {
    canvas.style.display = 'block';
    loadingEl.classList.remove('active');
    placeholderEl.style.display = 'none';
    updateButtons();
    return;
  }

  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.5 });

  canvas.width = viewport.width;
  canvas.height = viewport.height;
  canvas.style.width = '100%';
  canvas.style.height = '100%';

  await page.render({ canvasContext: ctx, viewport }).promise;
  renderedPages[pageNum] = true;

  canvas.style.display = 'block';
  loadingEl.classList.remove('active');
  placeholderEl.style.display = 'none';
  updateButtons();

  // Pre-render next pages
  if (pageNum + 1 <= totalPages && !renderedPages[pageNum + 1]) {
    prerenderPage(pageNum + 1);
  }
  if (pageNum + 2 <= totalPages && !renderedPages[pageNum + 2]) {
    prerenderPage(pageNum + 2);
  }
}

async function prerenderPage(pageNum) {
  if (renderedPages[pageNum]) return;
  const offCanvas = document.createElement('canvas');
  const offCtx = offCanvas.getContext('2d');
  const page = await pdfDoc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.5 });
  offCanvas.width = viewport.width;
  offCanvas.height = viewport.height;
  await page.render({ canvasContext: offCtx, viewport }).promise;
  renderedPages[pageNum] = true;
}

async function flipPage(direction) {
  if (isFlipping || !pdfDoc) return;
  if (direction === 'next' && currentPage >= totalPages) return;
  if (direction === 'prev' && currentPage <= 1) return;

  isFlipping = true;

  const goingForward = direction === 'next';
  const targetPage = goingForward ? currentPage + 1 : currentPage - 1;

  pageEl.classList.add('flipping');

  await new Promise(resolve => setTimeout(resolve, 300));

  currentPage = targetPage;
  await renderPage(currentPage);

  await new Promise(resolve => setTimeout(resolve, 80));

  pageEl.classList.remove('flipping');

  await new Promise(resolve => setTimeout(resolve, 350));
  isFlipping = false;
}

prevBtn.addEventListener('click', () => flipPage('prev'));
nextBtn.addEventListener('click', () => flipPage('next'));

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (!pdfDoc || isFlipping) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    flipPage('next');
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    flipPage('prev');
  }
});

// Touch swipe
let touchStartX = 0;
pageEl.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

pageEl.addEventListener('touchend', (e) => {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) {
    flipPage(diff > 0 ? 'next' : 'prev');
  }
});
</script>

</body>
</html>
